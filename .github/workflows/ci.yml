name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  analyze-test:
    name: analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pr-assets (blobless)
        run: git fetch --depth=1 --filter=blob:none origin pr-assets:refs/remotes/origin/pr-assets
      - name: macOS gallery file entitlement
        run: |
          for f in macos/Runner/DebugProfile.entitlements macos/Runner/Release.entitlements; do
            grep -A1 'com.apple.security.files.user-selected.read-only' "$f" | grep -q '<true/>'
          done
      - run: python3 tools/build_jmdict_sqlite/test_smoke.py
      - run: python3 tools/cer_bakeoff/test_cer.py
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check docs/qa/telas.md
        run: dart run tool/gen_telas.dart --check --ref origin/pr-assets
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test
