name: manga_jp
description: MangaJP Study — personal manga Japanese study tool (M1.1 share/import → crop → manga-ocr).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  go_router: ^18.0.2
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  sqlite3: ^3.5.2
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  intl: ^0.20.3
  crypto: ^3.0.7
  uuid: ^4.6.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  receive_sharing_intent: ^1.9.0
  image_picker: ^1.2.3
  image: ^4.10.1
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  riverpod_generator: ^4.0.9
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  go_router_builder: ^4.5.0
  drift_dev: ^2.35.1

flutter:
  uses-material-design: true
  assets:
    - assets/dict/
